port: 7890
socks-port: 7891
minxed-port: 10801

# 允许局域网连接
allow-lan: true 
# 设置跳过验证的 IP 段
skip-auth-prefixes: 
  - 127.0.0.1/8
  - ::1/128
# 允许连接的 IP 地址段，仅作用于 allow-lan 为 true, 默认值为 0.0.0.0/0 和::/0
lan-allowed-ips:   
  - 0.0.0.0/0
  - ::/0
# 禁止连接的 IP 地址段，黑名单优先级高于白名单，默认值为空
lan-disallowed-ips: 
  - 192.168.0.3/32

#  find-process-mode has 3 values:always, strict, off
#  - always, 开启，强制匹配所有进程
#  - strict, 默认，由 mihomo 判断是否开启
#  - off, 不匹配进程，推荐在路由器上使用此模式
find-process-mode: strict

mode: rule

# 日志等级 silent/error/warning/info/debug
log-level: silent 

# 开启 IPv6 总开关，关闭阻断所有 IPv6 链接和屏蔽 DNS 请求 AAAA 记录
ipv6: true

proxy-providers:
  all1:
    type: http
    url:  https://wget.la/https://raw.githubusercontent.com/mitjavaz/memo/refs/heads/master/subs-check/nodes/all1.yaml
    interval: 3600
    path: ./proxy_provider/all1.yaml
  all2:
    type: http
    url:  https://wget.la/https://raw.githubusercontent.com/mitjavaz/memo/refs/heads/master/subs-check/nodes/all2.yaml
    interval: 3600
    path: ./proxy_provider/all2.yaml
  all3:
    type: http
    url:  https://wget.la/https://raw.githubusercontent.com/mitjavaz/memo/refs/heads/master/subs-check/nodes/all3.yaml
    interval: 3600
    path: ./proxy_provider/all3.yaml

proxy-groups:
  - name: "🚀 代理模式"
    type: select
    proxies:
      - ✋ 节点一组
      - ✋ 节点二组
      - ✋ 节点三组
      - ♻️ 测速策略
      - ♻️ 回滚策略
    url: 'https://www.youtube.com/generate_204'
    timeout: 3000
    max-failed-times: 5

  - name: "✋ 不确定组"
    type: select
    use:
      - 🚀 代理模式
      - DIRECT

  - name: "✋ 节点一组"
    type: select
    use:
      - all1
      
  - name: "✋ 节点二组"
    type: select
    use:
      - all2

  - name: "✋ 节点三组"
    type: select
    use:
      - all3

  - name: "♻️ 测速策略"
    type: url-test
    use:
      - all1
      - all2
      - all3
    url: 'https://www.youtube.com/generate_204'
    interval: 600
    lazy: true
    timeout: 5000
    max-failed-times: 5

  - name: "♻️ 回滚策略"
    type: url-test
    use:
      - all1
      - all2
      - all3
    url: 'https://www.youtube.com/generate_204'
    interval: 600
    lazy: true
    timeout: 5000
    max-failed-times: 5

rule-providers:
  PROXY:
    type: http
    path: ./proxy_rules.yaml
    url: "https://wget.la/https://raw.githubusercontent.com/mitjavaz/memo/master/ClashRules/rule/proxy_rules.yaml"
    interval: 3600
    behavior: classical
    format: text
  AD:
    type: http
    path: ./AD_rules.yaml
    url: "https://wget.la/https://raw.githubusercontent.com/mitjavaz/memo/master/ClashRules/rule/AD_rules.yaml"
    interval: 3600
    behavior: classical
    format: text
  OTHER:
    type: http
    path: ./other_rules.yaml
    url: "https://wget.la/https://raw.githubusercontent.com/mitjavaz/memo/master/ClashRules/rule/other_rules.yaml"
    interval: 3600
    behavior: classical
    format: text

rules:
  - RULE-SET,PROXY,🚀 代理模式
  - RULE-SET,OTHER,✋ 不确定组
  - RULE-SET,AD,REJECT
  - GEOIP,CN,DIRECT
  - MATCH,DIRECT